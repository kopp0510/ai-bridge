name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Shell 語法檢查
        run: bash -n bridge.sh notify_telegram.sh
      - name: 安裝依賴
        run: pip install -r requirements-dev.txt
      - name: 執行測試
        run: pytest
